; Konfigurasi PHP produksi untuk portal Berdampak Utama
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Batas upload gambar CMS (thumbnail, galeri maks 10 foto, profil, cover catatan)
file_uploads = On
upload_max_filesize = 16M
post_max_size = 64M
max_file_uploads = 30

; OPcache untuk performa produksi Laravel
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
